<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ziggy — hors ligne</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: linear-gradient(160deg, #fff6e8, #e8f3ff); color: #1a1a2e; text-align: center; padding: 24px; }
      @media (prefers-color-scheme: dark) { body { background: linear-gradient(160deg, #0b1238, #1e2a6b); color: #eef; } }
      .ziggy { font-size: 88px; animation: float 3s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-10px) rotate(-4deg); } }
      @media (prefers-reduced-motion: reduce) { .ziggy { animation: none; } }
      h1 { font-size: 28px; margin: 12px 0 8px; }
      p { max-width: 380px; margin: 0 auto 20px; opacity: 0.8; line-height: 1.5; }
      a { display: inline-block; margin: 6px; padding: 12px 20px; border-radius: 999px; background: #22c55e; color: white; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="ziggy" aria-hidden="true">🤖</div>
      <h1>Ziggy est hors ligne</h1>
      <p>Pas de réseau pour le moment. Les pages déjà ouvertes restent disponibles : essaie Ziggy World ou le mode dodo.</p>
      <a href="/monde">🌍 Ziggy World</a>
      <a href="/dodo">🌙 Mode dodo</a>
      <a href="/" onclick="location.reload(); return false;">↻ Réessayer</a>
    </main>
  </body>
</html>
