[package]
name = "ziggy-tv-nav"
version = "0.1.0"
edition = "2021"
description = "Spatial navigation for Ziggy on TV: which element the remote's arrow keys move the focus to."
license = "MIT"
publish = false

# Standalone crate (not part of another workspace).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
