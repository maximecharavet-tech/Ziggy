[package]
name = "creatures-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "L'Usine à Créatures (Ziggy): recipes, surprise mixer, names, powers, challenges, album validation and share codes, compiled to WebAssembly."
license = "MIT"
publish = false

# Standalone crate (not part of another workspace).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.test]
opt-level = 2
