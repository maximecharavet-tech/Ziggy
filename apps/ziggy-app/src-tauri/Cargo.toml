[package]
name = "ziggy-app"
version = "1.0.0"
description = "Ziggy AI: the native shell (Android, Android TV, iPhone, iPad) around https://ziggy-ai.fr"
authors = ["Ziggy AI"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
# staticlib for iOS, cdylib for Android, rlib for the unit tests and desktop checks.
name = "ziggy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
# Same major as wry/tauri, so the JNI types match `JniHandle::exec`.
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSObject"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "UIApplication", "UIResponder", "UIFeedbackGenerator", "UIImpactFeedbackGenerator", "UINotificationFeedbackGenerator", "UISelectionFeedbackGenerator"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioSession", "AVAudioSessionTypes"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
